[project]
name = "smartbox"
version = "3.0.0"
requires-python = ">=3.14.2"
authors = [
  { name="Alberto Tudela", email="ajtudela@gmail.com" },
  { name="Delmael", email="delmael@outlook.com" },
  { name="graham33", email="graham@grahambennett.org" },
]
maintainers = [
  { name="Jan Dado" },
]
description = "Python API to control heating 'smart boxes'"
readme = "README.md"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "aiohttp>=3,<4",
]

[project.optional-dependencies]
cli = ["asyncclick"]

[project.scripts]
smartbox = "smartbox.cli:cli"

[project.urls]
Homepage = "https://github.com/jandado/smartbox"
Issues = "https://github.com/jandado/smartbox/issues"
Upstream = "https://github.com/ajtudela/smartbox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src/smartbox",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]


[dependency-groups]
dev = [
    "asyncclick",
    "multidict",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "tox",
    "yarl",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
addopts = "-m 'not network'"
markers = [
    "network: tests that make real HTTP calls to reseller servers (deselected by default; run with -m network)",
]

[tool.coverage.run]
# The CLI is an optional extra; it is exercised manually against the live API
# and by the `--help`/reseller smoke tests, not by the core coverage gate.
omit = ["src/smartbox/cli.py"]

[tool.coverage.report]
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["asyncio"]
ignore_missing_imports = true
disable_error_code = ["arg-type"]

[tool.ruff]
target-version = "py314"
fix = true
line-length = 88
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501", # line too long
    "D203",
    "D213",
    "RUF006",
    "FBT001",
    "FBT002",
    "PLR0913",
    "PLR0917", # positional-arg variant of PLR0913 (constructors take many args)
    "CPY001", # no copyright headers in this project (MIT, upstream style)
    # TC family: signature annotations are runtime API surface here — the
    # HA integration's contract tests introspect them (PEP 649 lazy
    # evaluation resolves names at access time), so typing-only imports
    # must stay runtime-available.
    "TC001",
    "TC002",
    "TC003",
    "A005",
    "COM812"
]


[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D10",
    "S105",
    "S101",
    "ANN201",
    "ANN001",
    "N802",
    "ANN202",
    "PTH123",
    "ASYNC230",
    "PT012",
    "DTZ001",
    "ANN003",
    "ANN002",
    "A001",
    "ARG001",
    "ANN204",
    "SLF001",
    "S106",
    "PLR2004",
    "B018",
    "PT011",
]
"src/smartbox/cli.py" = [
    "ANN401",
    "D10",
    "EM101",
    "EM102",
    "PLR2004",
    "TRY003",
]
"src/smartbox/core/**" = ["TID252"]
"tools/*" = ["T201", "ANN401", "INP001", "PLR0911", "PLR0915", "S108", "ASYNC240"]


[tool.tox]
env_list = ["3.14"]

[tool.tox.env_run_base]
isolated_build = true
description = "Run test under {base_python}"
dependency_groups = ["dev"]
commands = [["python", "-m", "pytest", "--cov=smartbox", "--cov-append", "--cov-report=term", "--cov-report=xml", "--junitxml=junit.xml"]]

[tool.sonar]
"sonar.python.version" = "3.14"
"python.coverage.reportPaths" = "coverage.xml"
"sonar.tests" = "tests"
"python.xunit.reportPath" = "junit.xml"
